[package]
name = "ndol"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/NostraDavid/ndol"
description = "NostraDavid's opinionated Python lint and fix rules."

[lib]
name = "ndol"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ndol"
path = "src/main.rs"

[features]
default = []
python = ["pyo3/extension-module"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
pyo3 = { version = "0.30.1", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.8"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
