[package]
name = "ndol"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/NostraDavid/ndol"
description = "NostraDavid's opinionated Python lint and fix rules."

[lib]
name = "ndol"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ndol"
path = "src/main.rs"

[features]
default = []
python = ["pyo3/extension-module"]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
pyo3 = { version = "0.27.2", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.23.0"
